# Checks every pull request into main: the UI type-checks and builds, and the Rust side compiles
# on Windows, macOS and Linux (each has code the others never compile). Publishes nothing.

name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]

# A new push to the pull request replaces the run still going for the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # Type-checks, then builds the bridge and the UI; the Rust build embeds both.
      - name: Build the UI
        run: npm run build

      - name: Compile the Rust side
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets
