# Releases a new version every time something is merged into main.
#
# 1. version: if the version in tauri.conf.json already has a release tag, bump the patch number
#    (scripts/bump-version.mjs) and commit it to main; a PR that bumps the version itself (say
#    to 0.2.0) keeps it. Then tag the commit.
# 2. build: installers for Windows, macOS (Apple Silicon and Intel) and Linux, attached to a
#    draft GitHub Release.
# 3. publish: only once every build passed. Writes latest.json for the in-app updater from the
#    uploaded installers and signatures (scripts/latest-json.mjs), then publishes the release.
#
# The version job also merges main back into dev, so dev carries the bumped version too.
#
# Needs the TAURI_SIGNING_PRIVATE_KEY secret (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key
# has one): updates are signed with it and the app checks them against the public key in
# tauri.conf.json.

name: Release

on:
  push:
    branches: [main]
    # Documentation-only changes don't need a new version.
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in merge order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pick the version and tag it
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          current=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if git rev-parse -q --verify "refs/tags/v$current" > /dev/null; then
            version=$(node scripts/bump-version.mjs patch)
            git commit -am "Release v$version"
            git push origin HEAD:main
          else
            version=$current
          fi
          git tag "v$version"
          git push origin "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The version bump only exists on main; bring it to dev so both branches agree. A conflict
      # (dev changed the same lines meanwhile) must not stop the release: it is left for a human.
      - name: Bring the version back to dev
        continue-on-error: true
        run: |
          git fetch origin main dev
          git checkout -B dev origin/dev
          if git merge --no-edit -m "Sync main into dev after v${{ steps.version.outputs.version }}" origin/main; then
            git push origin dev
          else
            git merge --abort
            echo "::warning::Could not merge main into dev automatically; merge it by hand."
            exit 1
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Dyno Music v__VERSION__
          releaseBody: Download the installer for your system below. Installed copies update themselves.
          releaseDraft: true
          prerelease: false
          # Written once by the publish job: four parallel builds updating it raced.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Write latest.json for the updater
        run: |
          node scripts/latest-json.mjs "$TAG" "$GITHUB_REPOSITORY" latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish the release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
